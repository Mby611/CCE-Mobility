[project]
name = "cce-mobility"
version = "0.1.0"
description = "CCE-Mobility: Counterfactual World-Agent Co-Evolution for Mobility Agents."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
mobilitybench = [
  "PyYAML>=6.0",
  "pandas>=2.1",
]
data = ["huggingface-hub>=0.25"]
travelplanner = ["pandas>=2.1", "numpy>=1.26", "tqdm>=4.0", "requests>=2.0"]
upstream-data = ["datasets>=3.0"]
dev = [
  "pytest>=8.0",
  "ruff==0.15.17",
]

[project.scripts]
cce = "cce_mobility.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
required-version = "==0.15.17"
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
